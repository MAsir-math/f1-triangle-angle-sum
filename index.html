<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="Classroom projection tool for the angle sum of a triangle. Tear and join, appendix proof, and textbook examples. 馬Sir教室.">
<title>Triangle Angle Sum Lab｜馬Sir教室</title>
<!--
  KaTeX (MIT) and JSXGraph (LGPL-3.0) via jsDelivr, suitable for Hong Kong classroom networks.
  Fallback (comment only):
    https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.21/katex.min.css
    https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.21/katex.min.js
    https://cdnjs.cloudflare.com/ajax/libs/jsxgraph/1.11.1/jsxgraphcore.js
    https://cdnjs.cloudflare.com/ajax/libs/jsxgraph/1.11.1/jsxgraph.css
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.11.1/distrib/jsxgraph.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.2.8/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.2.8/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.2.8/700.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23f7f1e6' width='32' height='32'/%3E%3Cpath fill='%231f4d3a' d='M16 6 26 23H6z'/%3E%3Cpath stroke='%231c1914' stroke-width='2' d='M3 25h26'/%3E%3C/svg%3E">
<style>
:root {
  --ground: #e7e0d2;
  --surface: #f7f1e6;
  --stage: #fbf7ef;
  --ink: #1c1914;
  --muted: #5a5448;
  --faint: #6d675c;
  --line: #d2cbbd;
  --rule: #e4ddd0;
  --accent: #1f4d3a;
  --accent-soft: #e4eee8;
  --accent-ink: #0e2f23;
  --angle-a: #1d4f9a;
  --angle-a-fill: #d6e4f6;
  --angle-b: #b8510c;
  --angle-b-fill: #f6dfcc;
  --angle-c: #1a6d45;
  --angle-c-fill: #d4ecdf;
  --ruler: #8a6a3b;
  --ruler-face: #c4a06a;
  --ruler-edge: #6d5228;
  --theorem: #e7efe6;
  --theorem-line: #b7c9b5;
  --warn: #f6edd6;
  --warn-line: #e0cc8e;
  --danger: #8f1e22;
  --ok: #1a6d45;
  --radius: 8px;
  --radius-sm: 6px;
  --gap: 16px;
  --pad: 20px;
  --ctrl-h: 44px;
  --font: "Source Sans 3", "Noto Sans", "Segoe UI", "Helvetica Neue", sans-serif;
  --shadow-float: 0 8px 24px rgba(28, 25, 20, 0.10);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 18px; line-height: 1.45; }
html { height: 100%; }
body { min-height: 100dvh; }
::selection { background: #cfe0d6; color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font-family: inherit; cursor: pointer; color: inherit; }
.num { font-variant-numeric: tabular-nums; }

.app {
  max-width: 1320px;
  margin: 0 auto;
  padding: 16px 24px 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-height: 100dvh;
}

.top {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
}
.brand {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  min-width: 0;
}
.mark {
  flex: none;
  width: 36px;
  height: 36px;
  margin-top: 2px;
}
.brand-text h1 {
  margin: 0;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.2;
}
.brand-text .sub {
  margin: 2px 0 0;
  font-size: 14px;
  color: var(--muted);
  font-weight: 400;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.modes {
  display: inline-flex;
  background: #ddd6c7;
  border-radius: 8px;
  padding: 3px;
  gap: 2px;
}
.modes button {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--muted);
  min-height: 36px;
  padding: 0 12px;
  border-radius: 6px;
  font-size: 15px;
  font-weight: 600;
  line-height: 1.2;
  white-space: nowrap;
}
.modes button[aria-pressed="true"] {
  background: var(--surface);
  color: var(--ink);
}
.modes button:hover { color: var(--ink); }
.notes-btn {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  min-height: 40px;
  padding: 0 12px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
}
.notes-btn[aria-expanded="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: #f6faf7;
}

.notes {
  display: none;
  background: #f3efe4;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px 16px;
}
.notes.is-open { display: block; }
.notes h2 {
  margin: 0 0 8px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.notes p, .notes li {
  margin: 0 0 8px;
  font-size: 15px;
  line-height: 1.55;
  color: var(--ink);
  font-language-override: normal;
}
.notes p:last-child, .notes ul:last-child { margin-bottom: 0; }
.notes ul { margin: 0; padding-left: 1.2em; }

.main {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
  gap: 16px;
  align-items: stretch;
  flex: 1;
}
.stage {
  background: var(--stage);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  min-height: 460px;
  height: calc(100dvh - 200px);
  min-height: 420px;
  max-height: 760px;
  position: relative;
  overflow: hidden;
}
.board {
  width: 100%;
  height: 100%;
  background: var(--stage);
}
.jxgbox { background: var(--stage); border: none !important; box-shadow: none !important; }
.JXGtext { font-family: var(--font) !important; }
.JXG_navigation, .JXGinfobox { display: none !important; }
.actions-col > .row { width: 100%; }
.actions-col > .row .btn,
.actions-col > .row .btn-wide,
.actions-col > .row .btn-ghost { width: auto; flex: 1 1 0; }

.side {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 0;
  overflow: auto;
}
.side h2 {
  margin: 0;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.25;
}
.lede {
  margin: 0;
  color: var(--ink);
  font-size: 16px;
}
.kicker-free {
  margin: 0;
  font-size: 13px;
  color: var(--muted);
}

.row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.choice, .btn, .btn-ghost, .btn-accent {
  appearance: none;
  border-radius: var(--radius-sm);
  min-height: var(--ctrl-h);
  padding: 0 14px;
  font-size: 16px;
  font-weight: 600;
  line-height: 1.2;
}
.choice {
  border: 1px solid var(--line);
  background: #fbf7ef;
  color: var(--ink);
}
.choice:hover { border-color: #b9b1a2; }
.choice[aria-pressed="true"] {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent-ink);
}
.btn {
  border: 1px solid var(--ink);
  background: var(--ink);
  color: #f7f1e6;
}
.btn:hover { background: #2a261f; }
.btn:disabled, .btn-accent:disabled, .btn-ghost:disabled, .choice:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.btn-accent {
  border: 1px solid var(--accent);
  background: var(--accent);
  color: #f6faf7;
}
.btn-accent:hover { background: #173b2d; }
.btn-ghost {
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink);
}
.btn-ghost:hover { background: #efe9dc; }
.btn-wide { flex: 1 1 140px; }
.actions-col { display: flex; flex-direction: column; gap: 8px; flex: 0 0 auto; }
.actions-col .btn,
.actions-col .btn-wide,
.actions-col .btn-accent,
.actions-col .btn-ghost {
  width: 100%;
  flex: 0 0 auto;
  min-height: var(--ctrl-h);
  height: auto;
  padding: 10px 14px;
}

.step-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.step {
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  background: #fbf7ef;
}
.step.is-dim { opacity: 0.45; }
.step.is-done { background: var(--theorem); border-color: var(--theorem-line); }
.step.is-active { border-color: var(--accent); background: #fbf7ef; }
.step .n {
  display: inline-block;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 4px;
}
.step p { margin: 0; font-size: 16px; }
.reason {
  margin-top: 8px;
  padding: 8px 10px;
  background: var(--warn);
  border: 1px solid var(--warn-line);
  border-radius: 4px;
  font-size: 16px;
}
.reason.filled {
  background: var(--theorem);
  border-color: var(--theorem-line);
}

.theorem {
  background: var(--theorem);
  border: 1px solid var(--theorem-line);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
}
.theorem p { margin: 0 0 8px; }
.theorem p:last-child { margin-bottom: 0; }
.abbrev {
  margin: 8px 0 0;
  font-size: 14px;
  color: var(--muted);
}

.item-nav {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.item-nav button {
  appearance: none;
  text-align: left;
  border: 1px solid var(--line);
  background: #fbf7ef;
  border-radius: var(--radius-sm);
  min-height: 44px;
  padding: 8px 12px;
  font-size: 16px;
  font-weight: 600;
}
.item-nav button[aria-pressed="true"] {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent-ink);
}

.stem {
  margin: 0;
  font-size: 17px;
}
.scaffold {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.prompt-q {
  margin: 0;
  font-size: 18px;
  font-weight: 650;
}
.options {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.options button {
  appearance: none;
  text-align: left;
  border: 1px solid var(--line);
  background: #fbf7ef;
  border-radius: var(--radius-sm);
  min-height: 42px;
  padding: 8px 12px;
  font-size: 16px;
}
.options button:hover { border-color: #b9b1a2; }
.options button.is-correct {
  background: var(--theorem);
  border-color: var(--ok);
}
.options button.is-wrong {
  border-color: var(--danger);
  color: var(--danger);
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 14px;
  margin: 0;
  padding: 0;
  list-style: none;
  font-size: 15px;
}
.legend i {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 2px;
  margin-right: 6px;
  vertical-align: -1px;
}
.legend .a { background: var(--angle-a); }
.legend .b { background: var(--angle-b); }
.legend .c { background: var(--angle-c); }

.feedback {
  margin: 0;
  font-size: 16px;
}
.feedback.ok { color: var(--ok); font-weight: 650; }
.feedback.bad { color: var(--danger); font-weight: 650; }

.katex { font-size: 1.08em; }
.eq { margin: 6px 0; }

.foot {
  margin: 0;
  font-size: 13px;
  color: var(--muted);
  padding-top: 4px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}

@media (max-width: 900px) {
  html, body { font-size: 16px; }
  .app { padding: 12px 12px 16px; }
  .main {
    grid-template-columns: 1fr;
  }
  .stage {
    height: 72vw;
    min-height: 360px;
    max-height: 560px;
  }
  .brand-text h1 { font-size: 20px; }
  .modes { width: 100%; }
  .modes button { padding: 0 8px; font-size: 13px; flex: 1; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <svg class="mark" viewBox="0 0 36 36" aria-hidden="true">
          <path fill="#1f4d3a" d="M18 5.5 30.5 27.5H5.5z"/>
          <path fill="none" stroke="#1c1914" stroke-width="2" stroke-linecap="square" d="M3 29.5h30"/>
        </svg>
        <div class="brand-text">
          <h1>Triangle Angle Sum Lab</h1>
          <p class="sub">馬Sir教室 · The sum of all the interior angles of a triangle</p>
        </div>
      </div>
      <div class="top-actions">
        <div class="modes" role="tablist" aria-label="Modes">
          <button type="button" role="tab" id="tab-tear" data-mode="tear" aria-pressed="true">A Tear and join</button>
          <button type="button" role="tab" id="tab-proof" data-mode="proof" aria-pressed="false">B Appendix proof</button>
          <button type="button" role="tab" id="tab-practice" data-mode="practice" aria-pressed="false">C Find the unknown angle</button>
        </div>
        <button type="button" class="notes-btn" id="notes-btn" aria-expanded="false" aria-controls="notes">Teacher notes 老師備註</button>
      </div>
    </header>

    <aside class="notes" id="notes" hidden lang="zh-Hant">
      <h2>老師備註</h2>
      <div id="notes-body"></div>
    </aside>

    <div class="main">
      <section class="stage" aria-label="Figure">
        <div id="board" class="board jxgbox" role="img" aria-label="Geometry figure"></div>
      </section>
      <aside class="side" id="side">
      </aside>
    </div>

    <p class="foot">This page does not collect any student data. It is for classroom projection and recap; it does not replace the paper tearing activity.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.11.1/distrib/jsxgraphcore.js"></script>
  <script src="app.js"></script>
</body>
</html>
